name: Compilar APK

on:
  push:
    branches: [main, claude/personal-finance-app-mobile-g5r8pi]
    paths:
      - index.html
      - icons/**
      - android/**
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar build-tools y plataforma Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Compilar APK
        run: bash android/build.sh

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: guita-apk
          path: android/build/guita.apk
          if-no-files-found: error

      - name: Publicar APK en la rama (dist/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp android/build/guita.apk dist/guita.apk
          git add dist/guita.apk
          git diff --cached --quiet || git commit -m "ci: publicar guita.apk compilado [skip ci]"
          git push
